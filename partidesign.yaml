name: partidesign
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.6
  - cuda-version=12.8
  - pip
  # Native AF3 SDK build tools and headers; all are conda-provisioned so the
  # editable/source installs below need no sudo or system package manager.
  - cmake>=3.28
  - ninja
  - cxx-compiler
  - libboost-devel=1.86
  # Use packaged Eigen headers rather than a GitLab clone during SDK build.
  - eigen=3.4.0
  - zlib
  - bzip2
  # Multi-connection model downloads; built-in HTTP remains the fallback.
  - aria2=1.37.0
  # Native AF3 protein/RNA MSA searches.
  - bioconda::hmmer>=3.4
  # CPU structural clustering; runtime also accepts an explicit upstream build.
  - bioconda::usalign>=2024.07.30
  # DockQ 2.1.3 (used by the vendored ESMFold2 stack) requires NumPy 2.x.
  # Pin the version exercised by PartiDesign, ESMFold2 and ColabDesign.
  - numpy=2.5.2
  - scipy=1.17.1
  - ambertools=24.8
  - openmm=8.4.0
  # Private standard-residue heavy-atom completion; preserves the public graph.
  - pdbfixer=1.12
  - openff-toolkit-base=0.18.0
  - parmed=4.3.1
  - pyarrow=21.0.0
  - lxml=6.0.2
  - tinydb=4.8.2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      # Keep the final pip transaction on the same exact NumPy ABI.
      - numpy==2.5.2
      - torch==2.9.1+cu128
      - lightning==2.5.0
      - pytorch-lightning==2.5.0
      - jaxtyping==0.3.2
      - wadler-lindig==0.1.7
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - PyYAML==6.0.3
      # Interactive task authoring in partidesign.ipynb (no model load).
      - ipywidgets==8.1.9
      - ipymolstar==0.1.0
      - nbformat==5.10.4
      - biotite==1.4.0
      - rdkit==2026.3.4
      - openbabel-wheel==3.1.1.23
      - vina==1.2.7
      - meeko==0.8.0
      - gemmi==0.7.5
      - tqdm==4.70.1
      # Lightweight terminal panels, status tables and download progress.
      - rich==14.3.4
      # Keyboard-controlled model selection in the interactive download dialog.
      - prompt-toolkit==3.0.53
      - openmmforcefields==0.15.1
      - ray==2.53.0
      - loguru==0.7.3
      # Audited Biohub fork copied with the ESMFold2 source; installing the
      # local checkout avoids a moving Git dependency during env creation.
      - ./community_models/esmfold2/source/transformers
      # Run `conda env create` from the repository root.  This installs the
      # audited vendored Biohub source without consulting a model/code registry.
      - ./community_models/esmfold2/source/esm
      - accelerate==1.14.0
      - huggingface-hub==0.36.2
      - tokenizers==0.22.2
      - safetensors==0.8.0
      # The exact NumPy-2-compatible DockQ fork used by ESMFold2 is vendored
      # locally; PyPI dockq 2.1.3 has incompatible dependency metadata.
      - ./community_models/esmfold2/source/dockq
      - ProDy==2.6.1
      - biopython==1.85
      - joblib==1.5.3
      - ml-collections==1.1.0
      - dm-haiku==0.0.16
      - dm-tree==0.1.9
      - optax==0.2.5
      - chex==0.1.87
      # AF2 Pallas/CyclicMPNN and AF3 use the JAX 0.10.2 CUDA 12 stack.
      - jax[cuda12]==0.10.2
      - jaxlib==0.10.2
      - jax-cuda12-pjrt==0.10.2
      - jax-cuda12-plugin[with-cuda]==0.10.2
      - nvidia-cuda-nvcc-cu12==12.8.93
      - tokamax==0.0.12
      - natsort==8.4.0
      - einops==0.8.2
      - msgpack-numpy==0.4.8
      - pytest==8.4.2
      - pillow==12.0.0
      - mpmath==1.3.0
      # ESM 3.3 runtime dependencies are pinned because runtime is offline.
      - boto3==1.43.62
      - brotli==1.2.0
      - cloudpathlib==0.24.0
      - dna-features-viewer==3.1.5
      - httpx==0.28.1
      - pydssp==0.9.1
      - pygtrie==2.5.0
      - scikit-learn==1.9.0
      - tenacity==9.1.4
      - zstd==1.5.7.2
      # Install the repository and the vendored AF3 SDK in the same conda
      # transaction.  Paths are intentionally relative to the repository root.
      - -e .
      - -e ./community_models/af3/source
