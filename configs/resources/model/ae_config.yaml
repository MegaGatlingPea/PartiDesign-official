latent_z_dim: &latent_z_dim 8

encoder:
  feats_seq:
    - chain_break_per_res
    - mol_type
    - x1_protein_token_type
    - x1_protein_atom37_coords
    - x1_protein_atom37_coords_rel
    - x1_protein_bb_angles
    - x1_protein_sidechain_angles
    - x1_rna_token_type
    - x1_rna_atom27_coords
    - x1_rna_atom27_coords_rel
    - x1_rna_atom27_coords_local
    - x1_rna_group_masks
    - x1_rna_torsion_angles
    - x1_dna_token_type
    - x1_dna_atom27_coords
    - x1_dna_atom27_coords_rel
    - x1_dna_atom27_coords_local
    - x1_dna_group_masks
    - x1_dna_torsion_angles
    - x1_ligand_element
    - x1_ligand_charge
    - x1_ligand_coord
    - x1_ligand_degree

  nlayers: 12
  token_dim: 768
  nheads: 12
  parallel_mha_transition: False

  strict_feats: False
  feats_cond_seq: []

  dim_cond: 256  # dimension of conditioning vector
  ligand_degree_bins: 9

  feats_pair_repr:
    - rel_seq_sep
    - rel_chain_idx
    - mol_pair
    - same_meta_pair
    - token_center_pair_dists
    - token_frame_pair_orientation
    - token_bond_pair

  seq_sep_dim: 127  # should be odd >= 5
  token_center_pair_dist_dim: 30
  token_center_pair_dist_min: 0.1  # in nm
  token_center_pair_dist_max: 3.0  # in nm
  pair_repr_dim: 256

  update_pair_repr: False
  update_pair_repr_every_n: 3
  use_tri_mult: False
  use_qkln: True

  normalize_latent: false
  latent_z_dim: *latent_z_dim

decoder:
  nlayers: 12
  token_dim: 768

  abs_coors: False

  nheads: 12
  parallel_mha_transition: False

  strict_feats: False

  feats_seq:
    - chain_break_per_res
    - token_center_nm
    - mol_type
    - z_latent_seq

  feats_cond_seq: []

  dim_cond: 256  # dimension of conditioning vector

  feats_pair_repr:
    - rel_seq_sep
    - rel_chain_idx
    - mol_pair
    - same_meta_pair
    - token_center_pair_dists

  seq_sep_dim: 127
  token_center_pair_dist_dim: 30
  token_center_pair_dist_min: 0.1  # in nm
  token_center_pair_dist_max: 3.0  # in nm
  pair_repr_dim: 256
  use_ligand_graph_decoder: true
  ligand_graph_node_dim: 256
  ligand_graph_edge_dim: 128
  ligand_graph_rbf_dim: 64
  ligand_graph_dist_min_nm: 0.05
  ligand_graph_dist_max_nm: 3.0
  ligand_graph_num_layers: 3
  ligand_graph_row_chunk_size: 64

  update_pair_repr: False
  update_pair_repr_every_n: 3
  use_tri_mult: False
  use_qkln: True
  latent_z_dim: *latent_z_dim
