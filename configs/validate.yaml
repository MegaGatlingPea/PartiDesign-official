# Shared context search defaults; model-specific settings below remain independently configurable.
methods:
- af3
ipsae:
  pae_cutoff: 10.0
sequence:
  seed: 101
  sources:
  - source: gt
    label: self
    count: 1
  - source: soluble_mpnn
    label: soluble
    count: 1
    settings:
      temperature: 0.1
af2:
  models:
  - 1
  samples: 1
  recycles: 3
  seed: 101
esmfold2:
  samples: 1
  mode: fast
  loops: 20
  steps: 100
  lm_dropout: 0.3
  seed: 101
  msa_max_depth: 1024
  msa_column_mask_rate: 0.1
  msa_subsample_at_inference: true
af3:
  samples: 1
  recycles: 10
  seed: 101
mol1:
  samples: 1
  recycles: 20
  steps: 200
  seed: 101
mol1_constraint:
  samples: 1
  recycles: 20
  steps: 200
  seed: 101
scorer:
  enabled: false
  original: true
  refold: true
  checkpoint: ./ckpts/partiscore.ckpt
  weights: raw
  batch_size: 32
  num_workers: 0
structure_stage: base
criteria: []
msa:
  # ESMFold2 standard consumes protein MSA only; its templates are always disabled.
  mode: auto
  source: colabfold
