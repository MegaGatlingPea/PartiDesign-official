# Docking benchmark: 40 samples per case; OpenMM postprocess and PartiScore enabled.
# CPSet 56 fixed-sequence docking cases; native peptide is chain P in each complex and its coordinates are masked for design.
cpset_1g9i_disulfide:
  input: ./configs/benchmarks/inputs/cpset/1g9i_complex.pdb
  sample_num: 40
  postprocess: true
  score: true
  design_chains:
  - P: peptide
  condition:
    sequence:
      P: EPCCDSCRCTKSIPPQCHCANI
    bond:
    - atom1:
        chain: P
        resid: 3
        atom: SG
      atom2:
        chain: P
        resid: 7
        atom: SG
      order: single
    - atom1:
        chain: P
        resid: 4
        atom: SG
      atom2:
        chain: P
        resid: 19
        atom: SG
      order: single
    - atom1:
        chain: P
        resid: 9
        atom: SG
      atom2:
        chain: P
        resid: 17
        atom: SG
      order: single
