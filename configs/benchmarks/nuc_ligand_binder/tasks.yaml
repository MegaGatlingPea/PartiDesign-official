# Current round: three fixed ligand contexts x RNA/DNA = 6 tasks, 600 structures.
# RNA length 30 nt; DNA length 20 nt; 100 structures per fixed-length task.
# Design benchmark: OpenMM postprocess and PartiScore disabled.
rna_ligand_binder_imidacloprid_nitroimine:
  input: ./configs/benchmarks/inputs/ligand_binder/nitroimine.cif
  sample_num: 100
  score: false
  design_chains:
  - R: rna
  design_length:
    R:
    - 30
  condition: &id001
    ligand:
      L:
        mode: smiles
        smiles: C1CN(/C(=N/[N+](=O)[O-])/N1)CC2=CN=C(C=C2)Cl
  hotspot: null
  postprocess: false
dna_ligand_binder_imidacloprid_nitroimine:
  input: ./configs/benchmarks/inputs/ligand_binder/nitroimine.cif
  sample_num: 100
  score: false
  design_chains:
  - D: dna
  design_length:
    D:
    - 20
  condition: *id001
  hotspot: null
  postprocess: false
rna_ligand_binder_ethyl_maltol:
