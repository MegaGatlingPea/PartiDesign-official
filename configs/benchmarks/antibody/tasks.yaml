# RFAntibody-inspired panel: 7 VHH settings and 2 paired VH/VL settings.
# Native sequences are evaluated with ESMFold2-fast; frameworks stay fixed.
antibody_hiv_env:
  format: antibody
  sample_num: 200
  antibody:
    scaffold:
      path: ./configs/benchmarks/inputs/antibody/scaffolds/h-NbBCII10.yaml
      roles: &id001
        VHH: H
      numbering: label_seq_id
    chains: *id001
    template: true
    design:
      VHH:
        cdrs:
        - CDR1
        - CDR2
        - CDR3
        lengths:
          CDR1: 7
          CDR2: 6
          CDR3:
            min: 5
            max: 13
        framework: false
  antigen:
    input: ./configs/benchmarks/inputs/antibody/targets/hiv_env.cif
    crop:
      include:
      - A
    hotspot: A65/A69/A129/A169
  score: false
  postprocess: false
  override: true
