# ProtDBench official generation budget: 4 backbones per integer binder length, 2840 total.
# Length ranges, target crops, and hotspots follow the benchmark paper Appendix A.1.
# Source: https://arxiv.org/html/2605.04118v1#S4.SS1 ; downstream 8 MPNN sequences do not multiply this backbone budget.
# Design benchmark: OpenMM postprocess and PartiScore disabled.
protdbench_bhrf1:
  input: ./configs/benchmarks/inputs/protdbench/BHRF1_2wh6_crop.pdb
  sample_num: 4
  postprocess: false
  score: false
  design_chains:
  - Z: protein
  design_length:
    Z: {min: 80, max: 120, step: 1}
  condition:
    secondary_structure:
      coarse:
        Z: alpha
  hotspot: A65/A74/A77/A82/A85/A93
