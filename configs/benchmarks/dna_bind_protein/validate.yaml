# NACraft NA-12 source targets; local PartiDesign validation budget and criterion.
methods:
- af3
sequence:
  seed: 101
  sources:
  - source: gt
    label: self
    count: 1
  - source: na_mpnn
    label: self_fi
    count: 1
    settings:
      temperature: 0.1
      fixed_interface:
        enabled: true
        cutoff: 6.0
  - source: na_mpnn
    label: mpnn
    count: 4
    settings:
      temperature: 0.1
criteria:
- af3_protein_na_complex
scorer:
  enabled: false
structure_stage: base
af3:
  samples: 1
  recycles: 10
  seed: 101
  msa:
    mode: auto
    search_workers: 2
    templates: true
    max_template_date: "2021-09-30"
