# Coarse-paired RNA/DNA variant of tasks.yaml; all original sampling settings are retained.
# This adds no token-level or explicit base-pair endpoint constraints.
# Reuse validate.yaml; keep outputs separate from the baseline run.
dna_bind_protein_8c58:
  input: ./configs/benchmarks/inputs/dna_bind_protein/8C58_protein.pdb
  sample_num: 100
  postprocess: false
  score: false
  crop:
    include:
    - A
  design_chains:
  - R: dna
  design_length:
    R:
    - 14
  hotspot: A302/A192/A304/A326
  condition:
    secondary_structure:
      coarse:
        R: paired
