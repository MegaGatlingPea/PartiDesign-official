# PartiDesign sampling budget: 200 de novo ligands per pocket; 5 pockets, 1000 total.
# Heavy-atom counts come from the model distribution. Validation uses refined structures for RDKit/QED and Vina Dock.
# De novo exception: OpenMM postprocess and PartiScore enabled; no ESMFold2/PAE gate.
ligand_design_2vt4:
  input: ./configs/benchmarks/inputs/ligand_design/2vt4_complex.pdb
  sample_num: 200
  score: true
  design_chains:
  - L: ligand
  design_length:
    L: from_distribution
  hotspot: A121/A211/A329/A310/A306/A215/A303/A307
  postprocess: true
