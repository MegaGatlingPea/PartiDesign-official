# Coarse-paired RNA/DNA variant of tasks.yaml; all original sampling settings are retained.
# This adds no token-level or explicit base-pair endpoint constraints.
# Reuse validate.yaml; keep outputs separate from the baseline run.
rna_bind_protein_8x0n:
  input: ./configs/benchmarks/inputs/rna_bind_protein/8X0N_protein.pdb
  sample_num: 100
  postprocess: false
  score: false
  crop:
    include:
    - A
  design_chains:
  - R: rna
  design_length:
    R:
    - 12
  hotspot: A17/A92/A59/A55
  condition:
    secondary_structure:
      coarse:
        R: paired
