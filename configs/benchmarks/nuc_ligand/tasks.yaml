# Docking benchmark: 40 samples per case; OpenMM postprocess and PartiScore enabled.
# Fixed-chemistry nucleic-acid ligand docking. The native ligand pose is masked during design.
nuc_ligand_1aju:
  input: ./configs/benchmarks/inputs/nuc_ligand/1AJU_complex.pdb
  sample_num: 40
  design_chains:
  - L: ligand
  condition:
    ligand:
      L:
        mode: smiles
        smiles: NC(=[NH2+])NCCC[C@H]([NH3+])C=O
  score: true
  postprocess: true
