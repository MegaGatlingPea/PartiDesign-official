# PPI demo with relaxed iteration screening and Mol-1 final validation.
preset: ppi
recycle: 3
iteration:
  mpnn: 4
  refold:
    method: esmfold2-fast
    worker_gpus: 1.0
  selection:
    max_pass: 200
  partial:
    fraction: 0.625
    replicas: 4
    include_parent: true
  relax: false
rounds:
  1:
    mpnn: 1
    selection:
      num_clusters: 200
final:
  max_pass: 200
  worker_gpus: 1.0
  method: mol1
  mol1: {samples: 5}
