# Three-model final filtering; a candidate passes when any method passes.
preset: ppi
recycle: 3
iteration:
  mpnn: 4
  refold:
    method: esmfold2-fast
    worker_gpus: 1.0
  filter:
  - af3_basic
  selection:
    max_pass: 200
  partial:
    fraction: 0.625
    replicas: 4
    include_parent: true
  relax: false
rounds:
  1:
    mpnn: 1
    selection:
      num_clusters: 200
final:
  max_pass: 200
  worker_gpus: 1.0
  methods:
  - af2_ig
  - mol1
  - af3
criteria_routes:
  protein:
    final:
      af2_ig:
      - af2_ig_protdbench
      mol1:
      - af3_basic
      af3:
      - af3_basic
  peptide:
    final:
      af2_ig:
      - af2_ig_peptide
      mol1:
      - af3_basic
      af3:
      - af3_basic
