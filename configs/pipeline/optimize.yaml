# Optimize existing complexes with the same iteration and final-validation profiles.
# Auto chooses the antibody, protein or nucleic-acid final profile per task.
# Select --preset ppi to also run paired AF2-IG models 1 and 2 for eligible binders.
preset: auto
recycle: 3

initial:
  partial:
    enabled: true
    fraction: 0.625
    replicas: 4
    include_parent: true

iteration:
  refold: esmfold2-fast
  partial:
    enabled: true
    fraction: 0.625
    replicas: 4
    include_parent: true
  relax: false
