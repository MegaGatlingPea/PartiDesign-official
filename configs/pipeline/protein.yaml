preset: protein
final:
  method: esmfold2-standard
  validation:
    esmfold2: {samples: 5}
criteria_routes:
  monomer:
    screen:
      esmfold2-fast:
      - pipeline_af3_protein_monomer
      af3:
      - pipeline_af3_protein_monomer
      af2_ig:
      - pipeline_af2_ig_protein
      mol1:
      - pipeline_af3_protein_monomer
    final:
    - af3_protein_monomer
  protein:
    screen:
      esmfold2-fast:
      - pipeline_protein_binder
      af3:
      - pipeline_protein_binder
      af2_ig:
      - pipeline_af2_ig_protein
      mol1:
      - pipeline_protein_binder
    final:
      af2_ig: [af2_ig_protein]
      mol1: [af3_basic]
      af3: [af3_basic]
      esmfold2-standard: [af3_basic]
  peptide:
    screen:
      esmfold2-fast:
      - pipeline_peptide_binder
      af3:
      - pipeline_peptide_binder
      af2_ig:
      - pipeline_af2_ig_peptide
      mol1:
      - pipeline_peptide_binder
    final:
      af2_ig: [af2_ig_peptide]
      mol1: [af3_peptide]
      af3: [af3_peptide]
      esmfold2-standard: [af3_peptide]
  nuc:
    screen:
      esmfold2-fast:
      - pipeline_af3_protein_bind_na
      af3:
      - pipeline_af3_protein_bind_na
      mol1:
      - pipeline_af3_protein_bind_na
    final:
    - af3_protein_bind_na
  ligand:
    screen:
      esmfold2-fast:
      - pipeline_af3_protein_bind_ligand
      af3:
      - pipeline_af3_protein_bind_ligand
      mol1:
      - pipeline_af3_protein_bind_ligand
    final:
    - af3_protein_bind_ligand
  antibody:
    screen:
      af2_ig:
      - pipeline_af2_ig_antibody
      esmfold2-fast:
      - pipeline_af3_antibody
      af3:
      - pipeline_af3_antibody
      mol1:
      - pipeline_af3_antibody
    final:
      af2_ig: [pipeline_af2_ig_antibody_final]
      mol1: [af3_antibody]
      af3: [af3_antibody]
      esmfold2-standard: [af3_antibody]
  ame:
    screen:
      esmfold2-fast:
      - pipeline_af3_ame
      af3:
      - pipeline_af3_ame
      mol1:
      - pipeline_af3_ame
    final:
    - af3_ame
  joint:
    screen:
      esmfold2-fast:
      - pipeline_af3_protein_na_complex
      af3:
      - pipeline_af3_protein_na_complex
      mol1:
      - pipeline_af3_protein_na_complex
    final:
    - af3_protein_na_complex
