# Antibody design and reference-start optimization share the native three-round flow.
# Iteration uses ESMFold2-fast; final ranks five standard samples by 0.8 ipTM + 0.2 pTM.
# Sequence defaults: ProteinMPNN, temperature 0.1, no backbone noise.
preset: antibody
final:
  method: esmfold2-standard
  validation:
    esmfold2: {samples: 5}
criteria_routes:
  antibody:
    screen:
      af2_ig: [pipeline_af2_ig_antibody]
      esmfold2-fast: [pipeline_af3_antibody]
      af3: [pipeline_af3_antibody]
      mol1: [pipeline_af3_antibody]
    final:
      af2_ig: [pipeline_af2_ig_antibody_final]
      mol1: [af3_antibody]
      af3: [af3_antibody]
      esmfold2-standard: [af3_antibody]
