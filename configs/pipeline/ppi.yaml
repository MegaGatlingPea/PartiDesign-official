# Protein/peptide binders: ESMFold2-fast iteration and paired AF2-IG final validation.
# Both selected AF2-IG model pairs must pass.
preset: ppi
final:
  method: af2_ig
  validation:
    af2:
      models:
      - 1
      - 2
      samples: 1
      mode: both
criteria_routes:
  protein:
    screen:
      esmfold2-fast:
      - pipeline_protein_binder
      af3:
      - pipeline_protein_binder
      mol1:
      - pipeline_protein_binder
      af2_ig:
      - pipeline_af2_ig_protein
    final:
      af2_ig: [af2_ig_protdbench]
      mol1: [af3_basic]
      af3: [af3_basic]
      esmfold2-standard: [af3_basic]
  peptide:
    screen:
      esmfold2-fast:
      - pipeline_peptide_binder
      af3:
      - pipeline_peptide_binder
      mol1:
      - pipeline_peptide_binder
      af2_ig:
      - pipeline_af2_ig_peptide
    final:
      af2_ig: [af2_ig_peptide]
      mol1: [af3_peptide]
      af3: [af3_peptide]
      esmfold2-standard: [af3_peptide]
