glp1r_vhh_bindcraft2:
  format: antibody
  sample_num: 5
  antibody:
    scaffold: bindcraft2_vhh
    chains:
      VHH: B
    template: true
    design:
      VHH:
        cdrs:
        - CDR1
        - CDR2
        - CDR3
        lengths:
          CDR1: official
          CDR2: official
          CDR3: official
        framework: 35/37/45/47/50/59/97-99/115-116
    paratope:
      VHH:
        cdrs:
        - CDR1
        - CDR2
        - CDR3
        framework: 26/34/51/58-59/95-96/115-116
  antigen:
    input: ./configs/examples/antibody_opt/glp1r_vhh_01.cif
    crop:
      include:
      - A
  score: false
  postprocess: false
  override: true

# TNFR1 mature extracellular domain; de novo VHH design.
tnfr1_vhh_bindcraft2:
  format: antibody
  sample_num: 400
  antibody:
    scaffold: bindcraft2_vhh
    chains: {VHH: B}
    template: true
    design:
      VHH:
        cdrs: [CDR1, CDR2, CDR3]
        lengths:
          CDR1: 7
          CDR2: {min: 5, max: 7}
          CDR3: {min: 8, max: 20}
        framework: "35/37/45/47/50/59/97-99/115-116"
    paratope:
      VHH:
        cdrs: [CDR1, CDR2, CDR3]
        framework: "26/34/51/58-59/95-96/115-116"
  antigen:
    input: ./configs/examples/structures/antibody_design/tnfr1.pdb
    crop:
      include: [A]
  score: false
  postprocess: false
  override: true

