antibody_fixture:
  format: antibody
  sample_num: 5
  antibody:
    scaffold: adalimumab.6cr1
    chains:
      VH: VH
      VL: VL
    template: true
    design:
      VH:
        cdrs:
        - CDR3
        lengths:
          CDR3: native
      VL: {}
  antigen:
    input: ./configs/examples/structures/antibody_design/7uxq.cif
    crop:
      include:
      - A
    hotspot: A20/A30-32
  score: false
  postprocess: false
  override: true
