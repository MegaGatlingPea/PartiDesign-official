ligand_fixture:
  input: ./configs/examples/structures/ligand_design/lig_bind_prot.cif
  sample_num: 5
  design_chains:
  - L: ligand
  design_length:
    L: from_distribution
  hotspot: A25-26/A29/A130/A175-176/A179/A182-183
  score: true
  postprocess: true
ligand_smiles_fixture:
  input: ./configs/examples/structures/ligand_design/lig_bind_prot.cif
  sample_num: 5
  design_chains:
  - L: ligand
  condition:
    ligand:
      L:
        mode: smiles
        smiles: O=C(O)C1=CC=CC=C1
  score: true
  postprocess: true
ligand_scaffold_hopping:
  input: ./configs/examples/structures/ligand_design/lig_redesign_prot.cif
  sample_num: 5
  design_chains:
  - L: ligand
  condition:
    backbone:
    - L
  postprocess: true
  score: true
ligand_covalent_docking:
  input: ./configs/examples/structures/ligand_design/lig_redesign_prot.cif
  sample_num: 5
  design_chains:
  - L: ligand
  condition:
    ligand:
      L:
        mode: type_bond
  postprocess: true
  score: true
ligand_motif_scaffolding:
  input: ./configs/examples/structures/ligand_design/lig_redesign_prot.cif
  sample_num: 5
  design_chains:
  - L: ligand
  design_length:
    L:
    - 41
  condition:
    ligand:
      L:
        mode: atom_motif
        atoms:
        - C24
        - C21
        - O3
  postprocess: true
  score: true
ligand_decoration:
  input: ./configs/examples/structures/ligand_design/lig_redesign_prot.cif
  sample_num: 5  # Samples per size in design_length.
  design_chains:
  - L: ligand
  design_length:
    L: [12, 13, 14]  # Six retained atoms plus six, seven, or eight new heavy atoms.
  condition:
    ligand:
      L:
        mode: atom_motif
        atoms: [C9, C13, C12, C11, N5, C10]
        attachments:
        - atom: C9
          new_atom: 1  # Endpoint index among new atoms, not a branch size.
          order: single
  postprocess: true
  score: true
ligand_decoration_two_sites:
  input: ./configs/examples/structures/ligand_design/lig_redesign_prot.cif
  sample_num: 5  # Samples per size in design_length.
  design_chains:
  - L: ligand
  design_length:
    L:
    - 12
    - 13
    - 14
  condition:
    ligand:
      L:
        mode: atom_motif
        atoms:
        - C9
        - C13
        - C12
        - C11
        - N5
        - C10
        attachments:
        - atom: C12
          new_atom: 1  # Endpoint index among new atoms, not a branch size.
          order: single
        - atom: C10
          new_atom: 2  # Attach this site to new-atom slot 2.
          order: single
  postprocess: true
  score: true
