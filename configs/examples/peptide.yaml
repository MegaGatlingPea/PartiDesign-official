peptide_fixture:
  input: ./configs/examples/structures/peptide_design/pep_bind_prot.pdb
  sample_num: 5
  design_chains:
  - P: peptide
  cyclic_offset: true
  design_length:
    P:
    - 13
  condition:
    bond:
    - atom1:
        chain: P
        resid: 1
        atom: N
      atom2:
        chain: P
        resid: -1
        atom: C
      order: single
  hotspot: A29/A33/A36-37/A42/A47/A68/A71
  score: false
  postprocess: false
