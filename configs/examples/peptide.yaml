peptide_dock_protein:
  cyclic_offset: false
  input: ./configs/examples/structures/peptide_design/pep_dock_prot.cif
  sample_num: 5
  design_chains:
  - B: peptide
  - C: peptide
  condition:
    sequence:
      B: YKKTEV
      C: '[BAL]'
    bond:
    - atom1:
        chain: B
        resid: 3
        atom: NZ
      atom2:
        chain: C
        resid: 1
        atom: C
      order: single
    - atom1:
        chain: B
        resid: 5
        atom: CD
      atom2:
        chain: C
        resid: 1
        atom: N
      order: single
      omit_atoms:
      - chain: B
        resid: 5
        atom: OE2
  postprocess: true
  score: true

